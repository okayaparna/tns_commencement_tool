<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New School 2025 Commencement Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <strong>The New School 2025 Commencement Studio</strong>
  </div>
  <div class="topbar-actions">
    <button id="btn-undo" class="ghost" title="Undo (⌘Z)">Undo</button>
    <button id="btn-random" class="ghost" title="New random seed (R)">Shuffle</button>
    <button id="btn-reset" class="ghost">Reset</button>
    <div class="split">
      <button id="btn-export" class="primary">Export PNG</button>
      <select id="export-type" title="File type">
        <option value="png">PNG image</option>
        <option value="svg">SVG vector</option>
        <option value="video">Video</option>
        <option value="preset">Preset JSON</option>
      </select>
    </div>
  </div>
</header>

<main class="layout">
  <aside class="panel left">
    <section>
      <h2>Looks</h2>
      <div id="looks" class="looks"></div>
    </section>
    <section>
      <h2>Pattern</h2>
      <div id="templates" class="templates"></div>
    </section>
    <section>
      <h2>Colours</h2>
      <div class="lbl">Background</div>
      <div id="bg-swatches" class="swatches"></div>
      <div class="lbl" style="margin-top:8px">Beam palette <span class="hint">(order = beam order)</span></div>
      <div id="palette" class="palette"></div>
      <div class="row gap">
        <button id="btn-add-color" class="small">+ Colour</button>
        <button id="btn-brand-colors" class="small">Brand set</button>
        <button id="btn-shuffle-colors" class="small">Rotate</button>
      </div>
    </section>
    <section>
      <h2>Canvas</h2>
      <select id="size-preset"></select>
      <div class="row gap" id="custom-size">
        <label>W <input type="number" id="size-w" min="16" max="8000"></label>
        <label>H <input type="number" id="size-h" min="16" max="8000"></label>
        <button id="btn-swap-size" class="small" title="Swap width and height">⇄</button>
      </div>
      <label class="toggle row-toggle"><input type="checkbox" id="guides-toggle"> Guides &amp; anchor</label>
    </section>
  </aside>

  <section class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="stage-info" id="stage-info"></div>
    </div>
    <div class="stagebar">
      <label>Mockup <select id="mockup"></select></label>
      <label class="toggle"><input type="checkbox" id="motion-toggle"> Motion</label>
      <span class="spacer"></span>
      <label>PNG scale <select id="png-scale"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <label>Video <input type="number" id="video-duration" min="1" max="60" step="0.5" style="width:56px"> s</label>
      <span id="video-format" class="hint"></span>
    </div>
  </section>

  <aside class="panel right">
    <div class="panel-tabs">
      <button type="button" data-tab="design" class="active">Design</button>
      <button type="button" data-tab="motion">Motion</button>
    </div>
    <div id="controls"></div>
  </aside>
</main>

<div id="toast" class="toast" hidden></div>
<div id="progress" class="progress" hidden><div class="bar"><i></i></div><span>Recording…</span></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
