# Publishes the studio to GitHub Pages on every push to main.
# There is no build step — the tool is plain ES modules — so this only stages the files that
# are actually served and hands them to Pages.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        # Only what the browser asks for: serve.js and package.json are for local development.
        run: |
          mkdir -p _site
          cp -r index.html css js fonts _site/
          # Belt and braces: only load-bearing if this ever moves to a branch deploy.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
